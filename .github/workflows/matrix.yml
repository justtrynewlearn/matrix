name: Dynamic Matrix

on:
  push:

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.config.outputs.matrix }}

    steps:
      - name: Create matrix
        id: config
        run: |
          echo 'matrix={"threads":[10,50,100]}' >> "$GITHUB_OUTPUT"

  performance-test:
    needs: prepare

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - name: Run performance test
        run: |
          echo "Running performance test"
          echo "Threads: ${{ matrix.threads }}"
