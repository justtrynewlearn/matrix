name: Matrix Practice

on:
  push:

jobs:
  performance-test:
    strategy:
      fail-fast: false

      matrix:
        threads: [10, 50, 100]

    runs-on: ubuntu-latest

    steps:
      - name: Run test
        run: |
          echo "Threads: ${{ matrix.threads }}"

          if [ "${{ matrix.threads }}" = "50" ]; then
            echo "Test failed"
            exit 1
          fi

          echo "Test passed"
