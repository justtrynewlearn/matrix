name: Matrix + Needs

on:
  push:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare test
        run: |
          echo "Preparing performance test"
          echo "Environment: staging"

  performance-test:
    needs: prepare

    strategy:
      fail-fast: false

      matrix:
        threads: [10, 50, 100]

    runs-on: ubuntu-latest

    steps:
      - name: Run performance test
        run: |
          echo "Running test with ${{ matrix.threads }} threads"

          if [ "${{ matrix.threads }}" = "50" ]; then
            echo "Performance test failed"
            exit 1
          fi

          echo "Performance test passed"

  report:
    needs: performance-test

    runs-on: ubuntu-latest

    steps:
      - name: Generate report
        run: |
          echo "Generating performance test report"
