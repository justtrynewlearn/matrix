name: Matrix Continue On Error

on:
  push:

jobs:
  performance-test:
    strategy:
      fail-fast: false

      matrix:
        include:
          - threads: 10
            experimental: false

          - threads: 50
            experimental: false

          - threads: 100
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    runs-on: ubuntu-latest

    steps:
      - name: Run performance test
        run: |
          echo "Threads: ${{ matrix.threads }}"
          echo "Experimental: ${{ matrix.experimental }}"

          if [ "${{ matrix.threads }}" = "100" ]; then
            echo "Experimental test failed"
            exit 1
          fi

          echo "Test passed"
